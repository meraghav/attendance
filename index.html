<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
body{
  margin:0;
  font-family: 'Inter', sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

/* CONTAINER */
.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

/* GLASS CARD */
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:25px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  position:relative;
}

.hidden{
  display:none !important;
}

#loader{
  pointer-events: none;
}

#loader[style*="none"]{
  pointer-events: none;
}

/* TITLE */
#welcome{
  margin-top:60px;
  font-size:26px;
  font-weight:600;
}

/* INPUT */
input{
  width:90%;
  padding:15px;
  border-radius:20px;
  border:none;
  outline:none;
  font-size:16px;
  background:rgba(255,255,255,0.08);
  color:white;
}

/* SUGGESTIONS */
#suggestions{
  margin-top:10px;
  border-radius:15px;
  overflow:hidden;
  background: rgba(0,0,0,0.8);
  position: relative;
  z-index: 10;
}

.s-item{
  padding:12px;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
}
.s-item:hover{
  background:rgba(255,255,255,0.08);
}

/* CAMERA */
.camera{
  width:240px;
  height:240px;
  border-radius:50%;
  overflow:hidden;
  margin:20px auto;
  position:relative;
  box-shadow:0 0 0 5px rgba(34,197,94,0.3),
             0 0 40px rgba(34,197,94,0.4);
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

/* BUTTON */
button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:30px;
  font-size:17px;
  font-weight:600;
  margin-top:15px;
  cursor:pointer;
  transition:0.2s;
  position:relative;
  z-index:20;
}

.login{
  background:linear-gradient(135deg,#22c55e,#4ade80);
  color:white;
}

.logout{
  background:linear-gradient(135deg,#ef4444,#f87171);
  color:white;
}

button:hover{
  transform:scale(1.04);
}

/* TIMER */
#timer{
  font-size:22px;
  margin-top:15px;
  opacity:0.9;
}

/* LOADER */
#loader{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.spinner{
  width:50px;
  height:50px;
  border:5px solid #333;
  border-top:5px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg)}
}

  #toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  color:white;
  padding:14px 20px;
  border-radius:12px;
  opacity:0;
  transition:0.3s;
}
#toast.show{
  opacity:1;
}

  /* TOPPER CARD */
#topperCard{
  position:relative;
  overflow:hidden;

  border:2px solid rgba(255,215,0,.5);

  animation:goldGlow 2s infinite alternate;
}

@keyframes goldGlow{

  from{
    box-shadow:0 0 15px rgba(255,215,0,.2);
  }

  to{
    box-shadow:0 0 35px rgba(255,215,0,.6);
  }
}

.crown{
  position:absolute;
  top:5px;
  right:150px;

  font-size:24px;

  animation:floatCrown 2s infinite ease-in-out;
}

@keyframes floatCrown{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-5px);
  }

  100%{
    transform:translateY(0px);
  }
}

.quote{
  font-size:12px;
  opacity:.8;
  margin-top:8px;
}
</style>
</head>

<body>

<div id="loader" style="display:none;">
  <div class="spinner"></div>
</div>

<div class="container">

<h2 id="welcome"></h2>

<!-- TOPPER -->
<div id="topperCard" class="card hidden">

<div id="topperWrap"></div>

</div>

  <!-- STAFF TYPE -->
<div id="staffTypeBox"
style="
display:flex;
gap:10px;
margin-top:25px;
background:#1e293b;
padding:8px;
border-radius:30px;
">

<button id="permanentBtn"
onclick="setStaffType('permanent')"
style="
flex:1;
width:auto;
margin-top:0;
padding:14px;
border:none;
border-radius:22px;
background:linear-gradient(135deg,#22c55e,#4ade80);
color:white;
font-size:17px;
font-weight:600;
">
Permanent
</button>

<button id="temporaryBtn"
onclick="setStaffType('temporary')"
style="
flex:1;
width:auto;
margin-top:0;
padding:14px;
border:none;
border-radius:22px;
background:#334155;
color:white;
font-size:17px;
font-weight:600;
">
Temporary
</button>

</div>

<!-- SEARCH -->
<div id="step2" class="card hidden">

<div id="permanentFields">

<input id="name"
placeholder="Search your name..."
onkeyup="filterNames()">

<div id="suggestions"></div>

</div>

<div id="temporaryFields"
class="hidden">

<input id="tempName"
placeholder="Temporary Staff Name"
style="margin-bottom:10px;">

<input id="tempDept"
placeholder="Department">

<button class="login"
onclick="continueTemporary()">
Continue
</button>

</div>

</div>

<!-- CAMERA -->
<div id="step3" class="card hidden">
  <div class="camera">
    <video id="cam" autoplay muted playsinline></video>
  </div>
  <button id="actionBtn" class="login">📸 IN</button>
</div>

<!-- TIMER -->
<div id="step4" class="card hidden">
  <div id="timer"></div>
  <button class="logout" onclick="confirmLogout()">🔴 OUT</button>
</div>

</div>

<div id="toast"></div>
  
<script>
let staffType = "permanent";
let employees = [];
let hasCheckedIn = false;
let loader = document.getElementById("loader");
let cam = document.getElementById("cam");
let timer = document.getElementById("timer");
let name = document.getElementById("name");
let selectedEmployee = null;
let currentMode = "in"; // or "out"
let employeeDescriptor = null;
let descriptorMap = {};

const actionBtn = document.getElementById("actionBtn");

actionBtn.onclick = () => {
  sendAttendance(currentMode);
};

fetch("https://script.google.com/a/macros/z1tech.com/s/AKfycbyrfqxx5f20yUAQWWEf8ittksQQmEeFqt9dttcQ7fDZqxB1mvrmpEEsJZCDxsudTAcGwg/exec?type=staff&key=Z1TECH123")
.then(res => res.json())
.then(data => {

  employees = data.slice(1).map(row => ({
  id: row[0],
  name: row[1],
  dept: row[2],
  photo: row[3]
}));
  preloadDescriptors();
});

  // LOAD TOPPER
fetch("https://script.google.com/a/macros/z1tech.com/s/AKfycbyrfqxx5f20yUAQWWEf8ittksQQmEeFqt9dttcQ7fDZqxB1mvrmpEEsJZCDxsudTAcGwg/exec?type=topper&key=Z1TECH123")
.then(res=>res.json())
.then(data=>{

 let topper = data || {};

  if(!topper || !topper.name) return;

  document.getElementById("topperCard").classList.remove("hidden");

  document.getElementById("topperWrap").innerHTML = `

  <div class="crown">👑</div>

  <img src="${topper.photo}"
  style="
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid gold;
  box-shadow:0 0 25px rgba(255,215,0,.7);
  ">

  <h2 style="
  margin:12px 0 5px;
  color:#FFD700;
  ">
  Employee Of The Month
  </h2>

  <div style="
  font-size:22px;
  font-weight:700;
  ">
  ${topper.name}
  </div>

  <div style="
  margin-top:6px;
  opacity:.8;
  ">
  🗓️ Present ${topper.days} Days This Month
  </div>

  <div class="quote">
  “Consistency beats talent.”
  </div>

  `;
});


// STEP CONTROL
function show(id){

  // hide only steps
  ["step2","step3","step4"].forEach(step=>{
    document.getElementById(step).classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");
}

// TYPEWRITER
let txt="Welcome to Z1Tech";
let i=0;
function type(){
  if(i<txt.length){
    welcome.innerHTML+=txt.charAt(i);
    i++;
    setTimeout(type,60);
  } else {
    setTimeout(()=>show("step2"),500);
  }
}
type();

// SEARCH
function filterNames(){

  let input = document.getElementById("name");
  let val = (input.value || "").toLowerCase();
  let box = document.getElementById("suggestions");

  box.innerHTML = "";

  if(!val) return;

  employees
  .filter(e => e.name && e.name.toLowerCase().includes(val))
  .forEach(e => {

    let div = document.createElement("div");

    div.className = "s-item";

    div.innerHTML = `
      <div style="
        display:flex;
        align-items:center;
        gap:12px;
      ">

        <img src="${e.photo}"
          style="
            width:42px;
            height:42px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid #22c55e;
          ">

        <div>
          <div style="font-weight:600">${e.name}</div>
          <div style="font-size:12px;opacity:.7">
            ${e.dept || ""}
          </div>
        </div>

      </div>
    `;

    div.onclick = async () => {

      name.value = e.name;
      name.readOnly = true;
      name.disabled = true;

      selectedEmployee = e;

      employeeDescriptor =
      descriptorMap[e.name];

      if(!employeeDescriptor){

       showToast("Face loading ⏳");

       return;
     }

      box.innerHTML = "";

      setMode("in");

      show("step3");

      startCamera();
    };

    box.appendChild(div);

  });

}
// CAPTURE
function capture(){

  const video = document.getElementById("cam");

  const size = 320;

  const canvas = document.createElement("canvas");

  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const cropSize = Math.min(vw, vh);

  const sx = (vw - cropSize) / 2;
  const sy = (vh - cropSize) / 2;

  ctx.translate(size,0);
  ctx.scale(-1,1);

  ctx.drawImage(
    video,
    sx,
    sy,
    cropSize,
    cropSize,
    0,
    0,
    size,
    size
  );

  return canvas.toDataURL("image/jpeg",0.55);
}

// CAMERA
async function startCamera(){

  if(cam.srcObject){
    cam.srcObject.getTracks().forEach(t=>t.stop());
  }

  try{

    let stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:1280}
      }
    });

    cam.srcObject = stream;

    await cam.play();

    console.log("✅ Camera Ready");

  }catch(e){

    console.log(e);

    showToast("Camera permission denied ❌");
  }
}

// LOADER
function showLoader(){
  loader.style.display = "flex";
}

function hideLoader(){
  loader.style.display = "none";
}

// TIMER
let startTime,interval;
function startTimer(){

  if(interval) clearInterval(interval);

  startTime = new Date();

  interval = setInterval(()=>{

    let diff = Math.floor((new Date()-startTime)/1000);

    let m = Math.floor(diff/60);

    let s = diff%60;

    timer.innerText = "⏱ "+m+"m "+s+"s";

  },1000);
}
// LOGIN / LOGOUT
async function sendAttendance(type){

  showLoader();

  if(!cam.srcObject){
    hideLoader();
    showToast("Camera not started ❌");
    return;
  }

  if(!selectedEmployee){
    hideLoader();
    showToast("Please select your name first ❌");
    return;
  }

  // photo capture
  let photo = capture();

  // face match
 if(staffType === "permanent"){

  let match =
  await faceMatch(selectedEmployee.photo);

  if(!match){

    hideLoader();

    showToast("Face Not Matched ❌");

    return;
  }
}

  // check states
  if(type === "in" && hasCheckedIn){
    hideLoader();
    showToast("Already checked in ❌");
    return;
  }

  if(type === "out" && !hasCheckedIn){
    hideLoader();
    showToast("You have not checked in ❌");
    return;
  }

  navigator.geolocation.getCurrentPosition(

    async (pos) => {

      let dist = getDistance(
        pos.coords.latitude,
        pos.coords.longitude,
        OFFICE_LAT,
        OFFICE_LNG
      );

      if(dist > MAX_RADIUS){
        hideLoader();
        showToast("You are outside office area ❌");
        return;
      }

      let data = {
        key: "Z1TECH123",
        type: "attendance",
        action: type,
        name: selectedEmployee.name,
        dept: selectedEmployee.dept,
        photo: photo,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      };

      try{

        let res = await fetch(
          "https://script.google.com/a/macros/z1tech.com/s/AKfycbyrfqxx5f20yUAQWWEf8ittksQQmEeFqt9dttcQ7fDZqxB1mvrmpEEsJZCDxsudTAcGwg/exec",
          {
            method:"POST",
            headers:{
                    "Content-Type":"text/plain;charset=utf-8"
                     },
                     body: JSON.stringify(data)
          }
        );

        let txt = await res.text();

        console.log(txt);

        if(!res.ok){
          hideLoader();
          showToast("Server error ❌");
          return;
        }

      }catch(e){

        console.log(e);

        hideLoader();
        showToast("Network error ❌");
        return;
      }

      hideLoader();

      // stop camera AFTER request complete
      setTimeout(()=>{

        if(cam.srcObject){
          cam.srcObject.getTracks().forEach(t=>t.stop());
        }

      },500);

      showToast(type.toUpperCase() + " SUCCESSFULLY ✅");

  // OUT
      
  if(type === "out"){

  hasCheckedIn = false;

  clearInterval(interval);

  show("step2");

  name.value = "";

  name.disabled = false;

  name.readOnly = false;

document.getElementById("tempName").value = "";
document.getElementById("tempDept").value = "";
}

      // IN
      if(type === "in"){

        hasCheckedIn = true;

        show("step4");

        startTimer();
      }

    },

    (err) => {

      console.log(err);

      hideLoader();

      showToast("Location permission required ❌");
    }

  );
}

async function faceMatch(employeePhoto){

   if(!modelsLoaded){
    showToast("Models is loading... ⏳");
    return false;
  }

  const video = document.getElementById("cam");

  const detection = await faceapi.detectSingleFace(
    video,
    new faceapi.TinyFaceDetectorOptions()
  ).withFaceLandmarks().withFaceDescriptor();

  if(!employeePhoto){
  showToast("No stored photo ❌");
  return false;
}

  if(!detection){
    showToast("No face detected ❌");
    return false;
  }

  if(!employeeDescriptor){
  showToast("Face profile not loaded ❌");
  return false;
}

const distance = faceapi.euclideanDistance(
  detection.descriptor,
  employeeDescriptor
);

  console.log("Face distance:", distance);

  return distance < 0.5;
}

async function loadModels(){

  const MODEL_URL = "https://justadudewhohacks.github.io/face-api.js/models";

  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
console.log("✅ Models Loaded");
}

let modelsLoaded = false;
window.onload = async () => {
  showLoader();
  await loadModels();
   modelsLoaded = true;
  hideLoader();
};

const OFFICE_LAT = 28.499194530261953;  
const OFFICE_LNG = 77.08088784902715;   
const MAX_RADIUS = 150;       

function getDistance(lat1, lon1, lat2, lon2){

  const R = 6371e3;

  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;

  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;

  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}

function confirmLogout(){

  if(confirm("Are you sure you want to logout?")){

    setMode("out");

    show("step3");

    startCamera();
  }
}

async function autoDetectAndSend(){

  let match = await faceMatch(selectedEmployee.photo);

  if(match){
    sendAttendance(currentMode);
  } else {

    showToast("Face not detected. Try manually 👇");

    actionBtn.disabled = false;
    actionBtn.style.opacity = "1";
  }
}

  function showToast(msg, color="green"){

  let t = document.getElementById("toast");
  t.innerText = msg;
  t.style.background = color;
  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },3000);
}

  function setMode(mode){

  currentMode = mode;

  if(mode === "in"){
    actionBtn.innerText = "📸 IN";
    actionBtn.className = "login";
  }

  if(mode === "out"){
    actionBtn.innerText = "🔴 OUT";
    actionBtn.className = "logout";
  }
}

  function setStaffType(type){

  staffType = type;

  if(type === "permanent"){

    permanentBtn.style.background =
    "linear-gradient(135deg,#22c55e,#4ade80)";

    temporaryBtn.style.background =
    "#334155";

    document
    .getElementById("permanentFields")
    .classList.remove("hidden");

    document
    .getElementById("temporaryFields")
    .classList.add("hidden");
  }

  if(type === "temporary"){

    temporaryBtn.style.background =
    "linear-gradient(135deg,#22c55e,#4ade80)";

    permanentBtn.style.background =
    "#334155";

    document
    .getElementById("temporaryFields")
    .classList.remove("hidden");

    document
    .getElementById("permanentFields")
    .classList.add("hidden");
  }
}

  function continueTemporary(){

  let tName =
  document.getElementById("tempName").value;

  let tDept =
  document.getElementById("tempDept").value;

  if(!tName || !tDept){

    showToast("Fill all fields ❌");

    return;
  }

  selectedEmployee = {

    name: tName,
    dept: tDept,
    photo: ""
  };

  setMode("in");

  show("step3");

  startCamera();
}

  async function preloadDescriptors(){

  for(const e of employees){

    try{

      const img =
      await faceapi.fetchImage(e.photo);

      const detection =
      await faceapi
      .detectSingleFace(
        img,
        new faceapi.TinyFaceDetectorOptions()
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

      if(detection){

        descriptorMap[e.name] =
        detection.descriptor;
      }

    }catch(err){

      console.log(
        "Descriptor preload failed:",
        e.name
      );
    }
  }

  console.log("✅ Descriptors Ready");
}
</script>

</body>
</html>
