<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Z1Tech Attendance">
<link rel="stylesheet" href="./style.css">
<link rel="icon" type="image/jpeg" href="https://i.ibb.co/Pz5F8DyX/z1techh-logo.jpg">
<link rel="apple-touch-icon" href="https://i.ibb.co/Pz5F8DyX/z1techh-logo.jpg">
<link rel="manifest" href="./manifest.json">
<title>Z1Tech Attendance</title>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splashScreen">
  <div class="splash-inner">
    <img src="https://i.ibb.co/Pz5F8DyX/z1techh-logo.jpg" class="splash-logo" alt="Z1Tech Logo">
    <div class="splash-title">Z1Tech</div>
    <div class="splash-sub">Attendance System</div>
    <div class="splash-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="appRoot" style="opacity:0;transition:opacity 0.4s;">

<div id="loader" style="display:none;">
  <div class="spinner"></div>
</div>

<!-- OFFLINE BANNER -->
<div id="offlineBanner" class="hidden">
  📡 Offline — Attendance will sync when connected
</div>

<div class="container">
  <h2 id="welcome"></h2>
  <p id="subHeading">Face Recognition Attendance System</p>

  <!-- TOPPER -->
  <div id="topperCard" class="card hidden">
    <div id="topperWrap"></div>
  </div>

  <!-- STAFF TYPE -->
  <div id="staffTypeBox" style="display:flex;gap:10px;margin-top:25px;background:#1e293b;padding:8px;border-radius:30px;">
    <button id="permanentBtn" onclick="setStaffType('permanent')" style="flex:1;width:auto;margin-top:0;padding:14px;border:none;border-radius:22px;background:linear-gradient(135deg,#22c55e,#4ade80);color:white;font-size:17px;font-weight:600;">
      Permanent
    </button>
    <button id="temporaryBtn" onclick="setStaffType('temporary')" style="flex:1;width:auto;margin-top:0;padding:14px;border:none;border-radius:22px;background:#334155;color:white;font-size:17px;font-weight:600;">
      Temporary
    </button>
  </div>

  <!-- SEARCH -->
  <div id="step2" class="card hidden">
    <div id="permanentFields">
      <input id="name" placeholder="Search your name..." onkeyup="filterNames()">
      <div id="suggestions"></div>
    </div>

    <div id="temporaryFields" class="hidden">
      <input id="tempName" placeholder="Temporary Staff Name" style="margin-bottom:10px;">
      <select id="tempDept" style="width:100%;padding:14px 16px;margin-bottom:10px;background:#1e293b;color:white;border:1.5px solid #334155;border-radius:12px;font-size:15px;appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml;utf8,<svg fill=\"white\" height=\"20\" viewBox=\"0 0 24 24\" width=\"20\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M7 10l5 5 5-5z\"/></svg>');background-repeat:no-repeat;background-position:right 14px center;cursor:pointer;">
        <option value="" disabled selected>Select Department</option>
        <option value="Security Guard - Day">🌞 Security Guard - Day</option>
        <option value="Security Guard - Night">🌙 Security Guard - Night</option>
        <option value="Housekeeping">🧹 Housekeeping</option>
        <option value="Pantry">🍽️ Pantry</option>
        <option value="Driver">🚗 Driver</option>
        <option value="Office Boy">👔 Office Boy</option>
        <option value="Other">📋 Other</option>
      </select>
      <input id="tempMobile" placeholder="Mobile Number (10 digits)" type="tel" maxlength="10" inputmode="numeric" pattern="[0-9]{10}" style="margin-bottom:10px;">
      <button class="login" onclick="continueTemporary()">Continue</button>
    </div>
  </div>

  <!-- CAMERA -->
  <div id="step3" class="card hidden">

    <div id="faceStatus" style="text-align:center;min-height:24px;margin-bottom:8px;"></div>

    <div id="camWrap" class="camera" style="border-radius:50%;overflow:hidden;transition:border 0.3s;">
      <video id="cam" autoplay muted playsinline></video>
    </div>

    <button id="actionBtn" class="login">📸 IN</button>
  </div>

  <!-- TIMER -->
  <div id="step4" class="card hidden">
    <div id="attendanceBadge"></div>
    <div id="timer"></div>
    <div id="liveClock"></div>
    <button class="logout" onclick="confirmLogout()">🔴 OUT</button>
    <button class="history-btn" onclick="showHistory()">📋 My Attendance History</button>
  </div>

</div>
</div>

<!-- HISTORY MODAL -->
<div id="historyModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;font-size:18px;">My Attendance</h3>
      <button onclick="closeHistory()" style="width:auto;margin:0;padding:6px 14px;font-size:14px;background:rgba(255,255,255,0.1);">✕ Close</button>
    </div>
    <div id="historyContent">
      <div style="text-align:center;padding:20px;color:#94a3b8;">Loading...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- PWA install prompt -->
<div id="pwaPrompt" class="hidden">
  <div style="display:flex;align-items:center;gap:12px;">
    <img src="https://i.ibb.co/Pz5F8DyX/z1techh-logo.jpg" style="width:40px;height:40px;border-radius:8px;">
    <div>
      <div style="font-size:14px;font-weight:600;">Install Z1Tech App</div>
      <div style="font-size:12px;color:#94a3b8;">Phone pe add karein for quick access</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;margin-top:10px;">
    <button onclick="installPWA()" style="flex:1;margin:0;padding:10px;font-size:14px;background:linear-gradient(135deg,#22c55e,#4ade80);color:white;">Install</button>
    <button onclick="dismissPWA()" style="flex:1;margin:0;padding:10px;font-size:14px;background:rgba(255,255,255,0.1);color:white;">Later</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="app.js"></script>
</body>
</html>
