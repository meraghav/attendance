<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./style.css">
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

</head>

<body>

<div id="loader" style="display:none;">
  <div class="spinner"></div>
</div>

<div class="container">

<h2 id="welcome"></h2>

<p id="subHeading">
  Face Recognition Attendance System
</p>

<!-- TOPPER -->
  
<div id="topperCard" class="card hidden">

<div id="topperWrap"></div>

</div>

<!-- STAFF TYPE -->
  
<div id="staffTypeBox"
style="
display:flex;
gap:10px;
margin-top:25px;
background:#1e293b;
padding:8px;
border-radius:30px;
">

<button id="permanentBtn"
onclick="setStaffType('permanent')"
style="
flex:1;
width:auto;
margin-top:0;
padding:14px;
border:none;
border-radius:22px;
background:linear-gradient(135deg,#22c55e,#4ade80);
color:white;
font-size:17px;
font-weight:600;
">
Permanent
</button>

<button id="temporaryBtn"
onclick="setStaffType('temporary')"
style="
flex:1;
width:auto;
margin-top:0;
padding:14px;
border:none;
border-radius:22px;
background:#334155;
color:white;
font-size:17px;
font-weight:600;
">
Temporary
</button>

</div>

<!-- SEARCH -->
  
<div id="step2" class="card hidden">

<div id="permanentFields">

<input id="name"
placeholder="Search your name..."
onkeyup="filterNames()">

<div id="suggestions"></div>

</div>

<div id="temporaryFields"
class="hidden">

<input id="tempName"
placeholder="Temporary Staff Name"
style="margin-bottom:10px;">

<input id="tempDept"
placeholder="Department">

<button class="login"
onclick="continueTemporary()">
Continue
</button>

</div>

</div>

<!-- CAMERA -->
  
<div id="step3" class="card hidden">
  <div class="camera">
    <video id="cam" autoplay muted playsinline></video>
  </div>
  <button id="actionBtn" class="login">📸 IN</button>
</div>

<!-- TIMER -->
  
<div id="step4" class="card hidden">
  <div id="timer"></div>
  <button class="logout" onclick="confirmLogout()">🔴 OUT</button>
</div>

</div>

<div id="toast"></div>
  
<script src="app.js"></script>

</body>
</html>
