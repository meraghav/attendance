<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
body{
  margin:0;
  font-family: 'Inter', sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

/* CONTAINER */
.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

/* GLASS CARD */
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:25px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  position:relative;
}

.hidden{
  display:none !important;
}

#loader{
  pointer-events: none;
}

#loader[style*="none"]{
  pointer-events: none;
}

/* TITLE */
#welcome{
  margin-top:60px;
  font-size:26px;
  font-weight:600;
}

/* INPUT */
input{
  width:90%;
  padding:15px;
  border-radius:20px;
  border:none;
  outline:none;
  font-size:16px;
  background:rgba(255,255,255,0.08);
  color:white;
}

/* SUGGESTIONS */
#suggestions{
  margin-top:10px;
  border-radius:15px;
  overflow:hidden;
  background: rgba(0,0,0,0.8);
  position: relative;
  z-index: 10;
}

.s-item{
  padding:12px;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
}
.s-item:hover{
  background:rgba(255,255,255,0.08);
}

/* CAMERA */
.camera{
  width:240px;
  height:240px;
  border-radius:50%;
  overflow:hidden;
  margin:20px auto;
  position:relative;
  box-shadow:0 0 0 5px rgba(34,197,94,0.3),
             0 0 40px rgba(34,197,94,0.4);
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

/* BUTTON */
button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:30px;
  font-size:17px;
  font-weight:600;
  margin-top:15px;
  cursor:pointer;
  transition:0.2s;
  position:relative;
  z-index:20;
}

.login{
  background:linear-gradient(135deg,#22c55e,#4ade80);
  color:white;
}

.logout{
  background:linear-gradient(135deg,#ef4444,#f87171);
  color:white;
}

button:hover{
  transform:scale(1.04);
}

/* TIMER */
#timer{
  font-size:22px;
  margin-top:15px;
  opacity:0.9;
}

/* LOADER */
#loader{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.spinner{
  width:50px;
  height:50px;
  border:5px solid #333;
  border-top:5px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg)}
}

#toast{
  position:fixed;
  top:20px;
  right:20px;
  left:auto;
  bottom:auto;

  transform:none;

  background:#22c55e;
  color:white;
  padding:14px 20px;
  border-radius:12px;

  opacity:0;
  transition:0.3s;

  z-index:9999;

  pointer-events:none;
}

#toast.show{
  opacity:1;
}

  /* TOPPER CARD */
#topperCard{
  position:relative;
  overflow:hidden;

  border:2px solid rgba(255,215,0,.5);

  animation:goldGlow 2s infinite alternate;
}

@keyframes goldGlow{

  from{
    box-shadow:0 0 15px rgba(255,215,0,.2);
  }

  to{
    box-shadow:0 0 35px rgba(255,215,0,.6);
  }
}

.crown{
  position:absolute;
  top:5px;
  right:150px;

  font-size:24px;

  animation:floatCrown 2s infinite ease-in-out;
}

@keyframes floatCrown{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-5px);
  }

  100%{
    transform:translateY(0px);
  }
}

.quote{
  font-size:12px;
  opacity:.8;
  margin-top:8px;
}
</style>
</head>

<body>

<div id="loader" style="display:none;">
  <div class="spinner"></div>
</div>

<div class="container">

<h2 id="welcome"></h2>

<!-- TOPPER -->
<div id="topperCard" class="card hidden">

<div id="topperWrap"></div>

</div>

  <!-- STAFF TYPE -->
<div id="staffTypeBox"
style="
display:flex;
gap:10px;
margin-top:25px;
background:#1e293b;
padding:8px;
border-radius:30px;
">

<button id="permanentBtn"
onclick="setStaffType('permanent')"
style="
flex:1;
width:auto;
margin-top:0;
padding:14px;
border:none;
border-radius:22px;
background:linear-gradient(135deg,#22c55e,#4ade80);
color:white;
font-size:17px;
font-weight:600;
">
Permanent
</button>

<button id="temporaryBtn"
onclick="setStaffType('temporary')"
style="
flex:1;
width:auto;
margin-top:0;
padding:14px;
border:none;
border-radius:22px;
background:#334155;
color:white;
font-size:17px;
font-weight:600;
">
Temporary
</button>

</div>

<!-- SEARCH -->
<div id="step2" class="card hidden">

<div id="permanentFields">

<input id="name"
placeholder="Search your name..."
onkeyup="filterNames()">

<div id="suggestions"></div>

</div>

<div id="temporaryFields"
class="hidden">

<input id="tempName"
placeholder="Temporary Staff Name"
style="margin-bottom:10px;">

<input id="tempDept"
placeholder="Department">

<button class="login"
onclick="continueTemporary()">
Continue
</button>

</div>

</div>

<!-- CAMERA -->
<div id="step3" class="card hidden">
  <div class="camera">
    <video id="cam" autoplay muted playsinline></video>
  </div>
  <button id="actionBtn" class="login">📸 IN</button>
</div>

<!-- TIMER -->
<div id="step4" class="card hidden">
  <div id="timer"></div>
  <button class="logout" onclick="confirmLogout()">🔴 OUT</button>
</div>

</div>

<div id="toast"></div>
  
<script src="app.js"></script>

</body>
</html>
