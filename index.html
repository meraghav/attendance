<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
  margin:0;
  font-family: 'Inter', sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

/* CONTAINER */
.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

/* GLASS CARD */
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:25px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.hidden{
  display:none !important;
}

#loader{
  pointer-events: none;
}

#loader[style*="none"]{
  pointer-events: none;
}

/* TITLE */
#welcome{
  margin-top:60px;
  font-size:26px;
  font-weight:600;
}

/* INPUT */
input{
  width:90%;
  padding:15px;
  border-radius:20px;
  border:none;
  outline:none;
  font-size:16px;
  background:rgba(255,255,255,0.08);
  color:white;
}

/* SUGGESTIONS */
#suggestions{
  margin-top:10px;
  border-radius:15px;
  overflow:hidden;
  background: rgba(0,0,0,0.8);
  position: relative;
  z-index: 10;
}

.s-item{
  padding:12px;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
}
.s-item:hover{
  background:rgba(255,255,255,0.08);
}

/* CAMERA */
.camera{
  width:240px;
  height:240px;
  border-radius:50%;
  overflow:hidden;
  margin:20px auto;
  position:relative;
  box-shadow:0 0 0 5px rgba(34,197,94,0.3),
             0 0 40px rgba(34,197,94,0.4);
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

/* BUTTON */
button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:30px;
  font-size:17px;
  font-weight:600;
  margin-top:15px;
  cursor:pointer;
  transition:0.2s;
}

.login{
  background:linear-gradient(135deg,#22c55e,#4ade80);
  color:white;
}

.logout{
  background:linear-gradient(135deg,#ef4444,#f87171);
  color:white;
}

button:hover{
  transform:scale(1.04);
}

/* TIMER */
#timer{
  font-size:22px;
  margin-top:15px;
  opacity:0.9;
}

/* LOADER */
#loader{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.spinner{
  width:50px;
  height:50px;
  border:5px solid #333;
  border-top:5px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg)}
}

  #toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  color:white;
  padding:14px 20px;
  border-radius:12px;
  opacity:0;
  transition:0.3s;
}
#toast.show{
  opacity:1;
}

  /* TOPPER CARD */
#topperCard{
  position:relative;
  overflow:hidden;

  border:1px solid rgba(255,215,0,0.4);

  background:
    linear-gradient(
      135deg,
      rgba(255,215,0,0.08),
      rgba(255,255,255,0.05)
    );

  animation:goldGlow 2.5s ease infinite;
}

/* GOLD GLOW */
@keyframes goldGlow{

  0%{
    box-shadow:0 0 15px rgba(255,215,0,0.15);
  }

  50%{
    box-shadow:0 0 35px rgba(255,215,0,0.45);
  }

  100%{
    box-shadow:0 0 15px rgba(255,215,0,0.15);
  }
}

/* SHINE EFFECT */
.shine{
  position:absolute;
  top:0;
  left:-120%;

  width:60%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,0.25),
      transparent
    );

  transform:skewX(-20deg);

  animation:shineMove 4s linear infinite;
}

@keyframes shineMove{
  100%{
    left:150%;
  }
}

/* CROWN */
.crown{
  position:absolute;
  top:-12px;
  right:-5px;

  font-size:28px;

  animation:floatCrown 2s ease infinite;
}

@keyframes floatCrown{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-4px);
  }

  100%{
    transform:translateY(0);
  }
}

/* TEXT */
.topperTag{
  font-size:13px;
  color:#facc15;
  margin-bottom:5px;
  font-weight:600;
}

.topperName{
  font-size:24px;
  font-weight:700;
}

.topperDept{
  font-size:14px;
  opacity:.8;
  margin-top:3px;
}

.streak{
  margin-top:8px;
  font-size:13px;
  color:#fb923c;
  font-weight:600;
}

.rank{
  margin-top:4px;
  font-size:13px;
  color:#facc15;
  font-weight:600;
}

.quote{
  margin-top:18px;
  font-size:13px;
  opacity:.75;
  font-style:italic;
}
</style>
</head>

<body>

<div id="loader" style="display:none;">
  <div class="spinner"></div>
</div>

<div class="container">

<h2 id="welcome"></h2>

  <!-- TOPPER CARD -->
<div id="topperCard" class="card hidden">

  <div style="
    display:flex;
    align-items:center;
    gap:16px;
  ">

    <img id="topperImg"
      src=""
      style="
        width:80px;
        height:80px;
        border-radius:50%;
        object-fit:cover;
        border:3px solid gold;
        box-shadow:0 0 25px rgba(255,215,0,0.5);
      ">

    <div style="text-align:left;flex:1">

      <div style="
        font-size:13px;
        opacity:.7;
        margin-bottom:4px;
      ">
        ⭐ Monthly Top Performer
      </div>

      <div id="topperName"
        style="
          font-size:22px;
          font-weight:700;
        ">
      </div>

      <div id="topperDept"
        style="
          font-size:14px;
          opacity:.8;
          margin-top:4px;
        ">
      </div>

    </div>

  </div>

</div>

<!-- TOPPER CARD -->
<div id="topperCard" class="card hidden">

  <div class="shine"></div>

  <div style="
    display:flex;
    align-items:center;
    gap:16px;
  ">

    <!-- PHOTO -->
    <div style="position:relative">

      <img id="topperImg"
        src=""
        style="
          width:90px;
          height:90px;
          border-radius:50%;
          object-fit:cover;
          border:4px solid gold;
        ">

      <!-- CROWN -->
      <div class="crown">
        👑
      </div>

    </div>

    <!-- DETAILS -->
    <div style="text-align:left;flex:1">

      <div class="topperTag">
        🏆 Employee of the Month
      </div>

      <div id="topperName" class="topperName"></div>

      <div id="topperDept" class="topperDept"></div>

      <!-- STREAK -->
      <div class="streak">
        🔥 28 Days Streak
      </div>

      <!-- RANK -->
      <div class="rank">
        ⭐ Rank #1 This Month
      </div>

    </div>

  </div>

  <!-- QUOTE -->
  <div class="quote">
    “Success is the sum of small efforts repeated daily.”
  </div>

</div>

<!-- SEARCH -->
<div id="step2" class="card hidden">
  <input id="name" placeholder="Search your name..." onkeyup="filterNames()">
  <div id="suggestions"></div>
</div>

<!-- CAMERA -->
<div id="step3" class="card hidden">
  <div class="camera">
    <video id="cam" autoplay muted playsinline></video>
  </div>
  <button id="actionBtn" class="login">📸 IN</button>
</div>

<!-- TIMER -->
<div id="step4" class="card hidden">
  <div id="timer"></div>
  <button class="logout" onclick="confirmLogout()">🔴 OUT</button>
</div>

</div>

<div id="toast"></div>
  
<script>

let employees = [];
let hasCheckedIn = false;
let loader = document.getElementById("loader");
let cam = document.getElementById("cam");
let timer = document.getElementById("timer");
let name = document.getElementById("name");
let selectedEmployee = null;
let currentMode = "in"; // or "out"
let employeeDescriptor = null;

const actionBtn = document.getElementById("actionBtn");

actionBtn.onclick = () => {
  sendAttendance(currentMode);
};

fetch("https://script.google.com/a/macros/z1tech.com/s/AKfycbyrfqxx5f20yUAQWWEf8ittksQQmEeFqt9dttcQ7fDZqxB1mvrmpEEsJZCDxsudTAcGwg/exec?type=staff&key=Z1TECH123")
.then(res => res.json())
.then(data => {

  // TOPPER DATA
let topper = data[1]; // first employee

document.getElementById("topperImg").src = topper[3];
document.getElementById("topperName").innerText = topper[1];
document.getElementById("topperDept").innerText = topper[2];

document.getElementById("topperCard").classList.remove("hidden");

  employees = data.slice(1).map(row => ({
  id: row[0],
  name: row[1],
  dept: row[2],
  photo: row[3]
}));
});


// STEP CONTROL
function show(id){
  document.querySelectorAll(".card").forEach(d=>d.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

// TYPEWRITER
let txt="Welcome to Z1Tech";
let i=0;
function type(){
  if(i<txt.length){
    welcome.innerHTML+=txt.charAt(i);
    i++;
    setTimeout(type,60);
  } else {
    setTimeout(()=>show("step2"),500);
  }
}
type();

// SEARCH
function filterNames(){

  let input = document.getElementById("name");
  let val = (input.value || "").toLowerCase();
  let box = document.getElementById("suggestions");

  box.innerHTML = "";

  if(!val) return;

  employees
  .filter(e => e.name && e.name.toLowerCase().includes(val))
  .forEach(e => {

    let div = document.createElement("div");

    div.className = "s-item";

    div.innerHTML = `
      <div style="
        display:flex;
        align-items:center;
        gap:12px;
      ">

        <img src="${e.photo}"
          style="
            width:42px;
            height:42px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid #22c55e;
          ">

        <div>
          <div style="font-weight:600">${e.name}</div>
          <div style="font-size:12px;opacity:.7">
            ${e.dept || ""}
          </div>
        </div>

      </div>
    `;

    div.onclick = async () => {

      name.value = e.name;
      name.readOnly = true;
      name.disabled = true;

      selectedEmployee = e;

      showLoader();

      try{

        const img = await faceapi.fetchImage(e.photo);

        const refDetection = await faceapi
        .detectSingleFace(
          img,
          new faceapi.TinyFaceDetectorOptions()
        )
        .withFaceLandmarks()
        .withFaceDescriptor();

        if(refDetection){
          employeeDescriptor = refDetection.descriptor;
        }else{
          showToast("Stored face invalid ❌");
          hideLoader();
          return;
        }

      }catch(err){

        console.log(err);

        showToast("Face profile load failed ❌");

        hideLoader();

        return;
      }

      hideLoader();

      box.innerHTML = "";

      setMode("in");

      show("step3");

      startCamera();
    };

    box.appendChild(div);

  });

}
// CAPTURE
function capture(){

  const video = document.getElementById("cam");

  const size = 320;

  const canvas = document.createElement("canvas");

  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const cropSize = Math.min(vw, vh);

  const sx = (vw - cropSize) / 2;
  const sy = (vh - cropSize) / 2;

  ctx.translate(size,0);
  ctx.scale(-1,1);

  ctx.drawImage(
    video,
    sx,
    sy,
    cropSize,
    cropSize,
    0,
    0,
    size,
    size
  );

  return canvas.toDataURL("image/jpeg",0.55);
}

// CAMERA
async function startCamera(){

  if(cam.srcObject){
    cam.srcObject.getTracks().forEach(t=>t.stop());
  }

  try{

    let stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:1280}
      }
    });

    cam.srcObject = stream;

    await cam.play();

    console.log("✅ Camera Ready");

  }catch(e){

    console.log(e);

    showToast("Camera permission denied ❌");
  }
}

// LOADER
function showLoader(){
  loader.style.display = "flex";
}

function hideLoader(){
  loader.style.display = "none";
}

// TIMER
let startTime,interval;
function startTimer(){

  if(interval) clearInterval(interval);

  startTime = new Date();

  interval = setInterval(()=>{

    let diff = Math.floor((new Date()-startTime)/1000);

    let m = Math.floor(diff/60);

    let s = diff%60;

    timer.innerText = "⏱ "+m+"m "+s+"s";

  },1000);
}
// LOGIN / LOGOUT
async function sendAttendance(type){

  showLoader();

  if(!cam.srcObject){
    hideLoader();
    showToast("Camera not started ❌");
    return;
  }

  if(!selectedEmployee){
    hideLoader();
    showToast("Please select your name first ❌");
    return;
  }

  // photo capture
  let photo = capture();

  // face match
  let match = await faceMatch(selectedEmployee.photo);

  if(!match){
    hideLoader();
    showToast("Face Not Matched ❌");
    return;
  }

  // check states
  if(type === "in" && hasCheckedIn){
    hideLoader();
    showToast("Already checked in ❌");
    return;
  }

  if(type === "out" && !hasCheckedIn){
    hideLoader();
    showToast("You have not checked in ❌");
    return;
  }

  navigator.geolocation.getCurrentPosition(

    async (pos) => {

      let dist = getDistance(
        pos.coords.latitude,
        pos.coords.longitude,
        OFFICE_LAT,
        OFFICE_LNG
      );

      if(dist > MAX_RADIUS){
        hideLoader();
        showToast("You are outside office area ❌");
        return;
      }

      let data = {
        key: "Z1TECH123",
        type: "attendance",
        action: type,
        name: selectedEmployee.name,
        dept: selectedEmployee.dept,
        photo: photo,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      };

      try{

        let res = await fetch(
          "https://script.google.com/a/macros/z1tech.com/s/AKfycbyrfqxx5f20yUAQWWEf8ittksQQmEeFqt9dttcQ7fDZqxB1mvrmpEEsJZCDxsudTAcGwg/exec",
          {
            method:"POST",
            headers:{
                    "Content-Type":"text/plain;charset=utf-8"
                     },
                     body: JSON.stringify(data)
          }
        );

        let txt = await res.text();

        console.log(txt);

        if(!res.ok){
          hideLoader();
          showToast("Server error ❌");
          return;
        }

      }catch(e){

        console.log(e);

        hideLoader();
        showToast("Network error ❌");
        return;
      }

      hideLoader();

      // stop camera AFTER request complete
      setTimeout(()=>{

        if(cam.srcObject){
          cam.srcObject.getTracks().forEach(t=>t.stop());
        }

      },500);

      showToast(type.toUpperCase() + " SUCCESSFULLY ✅");

      // OUT
      if(type === "out"){

  hasCheckedIn = false;

  clearInterval(interval);

  show("step2");

  name.value = "";

  name.disabled = false;

  name.readOnly = false;
}

      // IN
      if(type === "in"){

        hasCheckedIn = true;

        show("step4");

        startTimer();
      }

    },

    (err) => {

      console.log(err);

      hideLoader();

      showToast("Location permission required ❌");
    }

  );
}

async function faceMatch(employeePhoto){

   if(!modelsLoaded){
    showToast("Models is loading... ⏳");
    return false;
  }

  const video = document.getElementById("cam");

  const detection = await faceapi.detectSingleFace(
    video,
    new faceapi.TinyFaceDetectorOptions()
  ).withFaceLandmarks().withFaceDescriptor();

  if(!employeePhoto){
  showToast("No stored photo ❌");
  return false;
}

  if(!detection){
    showToast("No face detected ❌");
    return false;
  }

  if(!employeeDescriptor){
  showToast("Face profile not loaded ❌");
  return false;
}

const distance = faceapi.euclideanDistance(
  detection.descriptor,
  employeeDescriptor
);

  console.log("Face distance:", distance);

  return distance < 0.5;
}

async function loadModels(){

  const MODEL_URL = "https://justadudewhohacks.github.io/face-api.js/models";

  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
console.log("✅ Models Loaded");
}

let modelsLoaded = false;
window.onload = async () => {
  showLoader();
  await loadModels();
   modelsLoaded = true;
  hideLoader();
};

const OFFICE_LAT = 28.499194530261953;   // change this
const OFFICE_LNG = 77.08088784902715;   // change this
const MAX_RADIUS = 150;       // meters

function getDistance(lat1, lon1, lat2, lon2){

  const R = 6371e3;

  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;

  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;

  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}

function confirmLogout(){

  if(confirm("Are you sure you want to logout?")){

    setMode("out");

    show("step3");

    startCamera();
  }
}

async function autoDetectAndSend(){

  let match = await faceMatch(selectedEmployee.photo);

  if(match){
    sendAttendance(currentMode);
  } else {

    showToast("Face not detected. Try manually 👇");

    actionBtn.disabled = false;
    actionBtn.style.opacity = "1";
  }
}

  function showToast(msg, color="green"){

  let t = document.getElementById("toast");
  t.innerText = msg;
  t.style.background = color;
  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },3000);
}

  function setMode(mode){

  currentMode = mode;

  if(mode === "in"){
    actionBtn.innerText = "📸 IN";
    actionBtn.className = "login";
  }

  if(mode === "out"){
    actionBtn.innerText = "🔴 OUT";
    actionBtn.className = "logout";
  }
}
</script>

</body>
</html>
